# Log Aggregation pipeline: Kafka (buffer, absorbs bursts so "millions of logs/day"
# doesn't overwhelm Elasticsearch) -> parse -> Elasticsearch, viewed in Kibana.
#
# Every service writes structured JSON to stdout (see services/common's
# logback-json-base.xml). Filebeat (logging/filebeat/filebeat.yml) tails each
# container's stdout via Docker autodiscover and ships the raw lines into the
# Kafka topic "app-logs". Logstash below is the only thing that talks to Kafka
# on the consuming side, decoupling log ingestion rate from indexing rate.

input {
  kafka {
    bootstrap_servers => "kafka:29092"
    topics => ["app-logs"]
    group_id => "logstash-log-indexer"
    codec => "json"
  }
}

filter {
  # Filebeat wraps the original JSON log line inside its own event under
  # [message] (or [log][original] depending on version) -- normalize both
  # shapes so the fields Logback emitted (service, level, logger_name,
  # thread_name, message, plus any MDC keys like jobId/orderId/roomId) land
  # as top-level fields we can search/filter on in Kibana.
  if [message] {
    json {
      source => "message"
      target => "app"
    }
  }

  if [app] {
    ruby {
      code => "
        event.get('app').each { |k, v| event.set(k, v) }
        event.remove('app')
      "
    }
  }

  date {
    match => ["@timestamp", "ISO8601"]
    target => "@timestamp"
  }

  mutate {
    remove_field => ["agent", "ecs", "input", "log", "cloud", "host"]
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "app-logs-%{+YYYY.MM.dd}"
  }

  # Uncomment while debugging the pipeline itself:
  # stdout { codec => rubydebug }
}
