# NOTE: single replica by design. A real HA Eureka setup peers multiple
# registry nodes with each other via eureka.client.service-url.defaultZone
# (each node registers itself with the others), so clients still see the
# registry if one node dies. That peer-to-peer topology is out of scope for
# this portfolio demo, which just needs one registry the other services
# can register with.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: discovery-server
  namespace: dsp
  labels:
    app: discovery-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: discovery-server
  template:
    metadata:
      labels:
        app: discovery-server
    spec:
      containers:
        - name: discovery-server
          image: distributed-systems-platform/discovery-server:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8761
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8761
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8761
            initialDelaySeconds: 30
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: discovery-server
  namespace: dsp
spec:
  selector:
    app: discovery-server
  ports:
    - port: 8761
      targetPort: 8761
